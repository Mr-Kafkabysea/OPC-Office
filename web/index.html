<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>OPC Office</title>
  <meta name="description" content="A live 3D office dashboard for your AI team.">
  <!-- the link preview (Telegram, X, iMessage): the dashboard itself -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="OPC Office">
  <meta property="og:title" content="OPC Office">
  <meta property="og:description" content="A live 3D office dashboard for your AI team.">
  <meta property="og:image" content="https://mr-kafkabysea.github.io/OPC-Office/assets/brand/og-dashboard.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="OPC Office">
  <meta name="twitter:image" content="https://mr-kafkabysea.github.io/OPC-Office/assets/brand/og-dashboard.png">
  <link rel="icon" type="image/png" href="./assets/brand/logo-mark.png">
  <link rel="apple-touch-icon" href="./assets/brand/logo-mark.png">
  <meta name="theme-color" content="#F3F4F6">
  <!-- Hide the office before first paint when the private #topic is missing. bothq.channel is CHANNEL_KEY in lib/access.js. -->
  <style>
    #gate { display: none; }
    html[data-gate="locked"] #gate {
      display: grid; place-items: center; box-sizing: border-box;
      min-height: 100vh; margin: 0; padding: 32px 20px;
      background: #f3f4f6; color: #1d1d1f;
      font: 500 16px/1.5 Inter, system-ui, sans-serif;
    }
    html[data-gate="locked"] #scene,
    html[data-gate="locked"] #topbar,
    html[data-gate="locked"] #floors,
    html[data-gate="locked"] #panel,
    html[data-gate="locked"] #feed { display: none !important; }
  </style>
  <script>
    (function () {
      var q = new URLSearchParams(location.search);
      var feed = q.get('feed') || '';
      var topicHash = /^#[A-Za-z0-9_-]{6,64}(?:@[^&#]+|&ntfy=[^&#]+)?$/.test(location.hash);
      var feedTopic = /^[A-Za-z0-9_-]{6,64}$/.test(feed);
      var open = q.get('demo') === '1' || topicHash || feedTopic;
      if (!open) {
        var remembered = false;
        try { remembered = !!localStorage.getItem('bothq.channel'); } catch (e) {}
        if (!remembered) document.documentElement.dataset.gate = 'locked';
      }
      if (document.documentElement.dataset.gate === 'locked') return;
      [{ rel: 'modulepreload', href: 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js' },
        { rel: 'preload', href: './assets/office/office.glb', as: 'fetch', crossOrigin: 'anonymous' }
      ].forEach(function (spec) {
        var link = document.createElement('link');
        link.rel = spec.rel;
        link.href = spec.href;
        if (spec.as) link.as = spec.as;
        if (spec.crossOrigin) link.crossOrigin = spec.crossOrigin;
        document.head.appendChild(link);
      });
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400..700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css">
  <link rel="stylesheet" href="./scene/scene.css">
  <link rel="stylesheet" href="./ui/ui.css">
  <link rel="stylesheet" href="./share/share.css">
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <section id="gate" aria-label="Private office">
    <div class="gate-card">
      <h1>Private office</h1>
      <p>This page does not open the office. Use your private link: the site address, then # and your channel. It works like a password, so do not share it.</p>
    </div>
  </section>
  <main id="scene" aria-label="Office"><div class="hq-loading" role="status"><span class="hq-loading-label">Building the office</span><span class="hq-loading-track"><i></i></span></div></main>
  <header id="topbar"></header>
  <nav id="floors" aria-label="Floors"></nav>
  <aside id="panel" aria-label="Bot card and floor team"></aside>
  <section id="feed" aria-label="Event feed"></section>
  <script type="module" src="./app.js"></script>
</body>
</html>
